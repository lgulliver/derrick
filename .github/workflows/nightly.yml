name: nightly

on:
  schedule:
    - cron: "0 6 * * 0"  # 06:00 UTC every Sunday
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-fail-fast

  build:
    name: build (${{ matrix.artifact }})
    needs: [fmt, clippy, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: derrick-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: derrick-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: derrick-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p derrick-cli
      - name: Stage binary
        run: |
          cp target/${{ matrix.target }}/release/derrick ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
      - name: Generate checksum
        run: shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    name: create nightly release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub release
        run: |
          TAG="nightly-$(date +'%Y%m%d')"
          TARGET="$(git rev-parse HEAD)"
          gh release create "$TAG" \
            --prerelease \
            --generate-notes \
            --target "$TARGET" \
            --title "Nightly build $(date +'%Y-%m-%d')" \
            derrick-linux-x86_64 \
            derrick-linux-x86_64.sha256 \
            derrick-macos-arm64 \
            derrick-macos-arm64.sha256 \
            derrick-macos-x86_64 \
            derrick-macos-x86_64.sha256
        env:
          GH_TOKEN: ${{ github.token }}
