name: ci

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (D72) target other PR branches, and
  # they need CI as much as PRs targeting main.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pre-commit/action@v3.0.1

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-fail-fast

  coverage:
    name: coverage (>=80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: |
          # Exclude files that require a live terminal, external CLIs (gh/git),
          # live API keys, or user interaction — none of these can be meaningfully
          # exercised in a headless CI environment.
          #
          # Genuinely untestable paths kept here:
          #   derrick-tui/src/event_loop.rs     — crossterm EventStream loop (real terminal)
          #   derrick-observe/src/stack.rs      — shells out to the gh CLI for PR data
          #   commands/observe.rs               — delegates to the terminal TUI event loop
          #   commands/stack.rs                 — primary execute() shells out to git/gh
          #   commands/uninstall.rs             — stdin confirmation prompt + FS deletion (no tests)
          #   commands/ticket.rs                — shells out to gh for PR/diff data (no tests)
          #   commands/doctor.rs                — shells out to git and gh (no tests)
          #   commands/foreman.rs               — daemonises the process via exec(2) (no tests)
          #   commands/run.rs                   — thin wrapper; no unit-testable logic (no tests)
          #   commands/status.rs                — thin wrapper; no unit-testable logic (no tests)
          #   commands/survey.rs                — thin wrapper; no unit-testable logic (no tests)
          #   providers/anthropic.rs            — Anthropic Messages API (SSE HTTP, live key)
          #   providers/openai_cli.rs           — codex CLI subprocess or OpenAI API (live key)
          #   providers/opencode.rs             — opencode CLI subprocess (external binary)
          #   providers/subprocess.rs           — shared async subprocess streaming helper
          #   derrick-tools/src/process.rs      — tokio subprocess + streaming (real binary)
          #   derrick-caveman/src               — pure compression logic; 0 tests currently
          #   derrick-flow/src/code_review.rs   — run_code_review() calls live models API
          #
          # Removed from this list since prior audit (now have tests):
          #   derrick-tui/src/tabs.rs           — ratatui TestBackend tests added
          #   derrick-observe/src/lib.rs        — read_memory_entries() tests added
          #   commands/{add,caveman,gain,scrub,switch,init_wizard}.rs — unit tests added
          #   derrick-assay/src                 — io.rs and lib.rs have tests
          #   derrick-memory/src                — lib.rs has tests
          #   derrick-scrub/src                 — lib.rs + rules/ have tests
          #   derrick-stack/src                 — lib.rs + backends/ have tests
          #   derrick-substrate-native/src/foreman.rs — tests added
          #   derrick-substrate/src/types.rs    — tests added
          #   derrick-tools/src/hosts           — hosts/claude.rs has JSON-parsing tests
          #   derrick-adopt/src                 — lib.rs has tests
          #   derrick-claude/src                — dispatcher.rs + prompt.rs have tests
          #   derrick-copilot/src               — dispatcher/branch/client have tests
          #   derrick-survey/src/mcp.rs         — SurveyServer tested via duplex transport
          #   derrick-flow/src/template.rs      — file no longer exists (stale exclusion)
          EXCLUDE='event_loop\.rs|derrick-observe/src/stack\.rs|commands/(observe|stack|uninstall|ticket|doctor|foreman|run|status|survey)\.rs|derrick-tools/src/process\.rs|derrick-models/src/providers/(anthropic|openai_cli|opencode|subprocess)\.rs|derrick-caveman/src|derrick-flow/src/code_review\.rs'
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info \
            --ignore-filename-regex "$EXCLUDE" \
            --fail-under-lines 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
