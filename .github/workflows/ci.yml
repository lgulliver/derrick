name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pre-commit/action@v3.0.1

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-fail-fast

  coverage:
    name: coverage (>=80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: |
          # Exclude files that require a live terminal, external CLIs (gh/git),
          # live API keys, or user interaction — none of these can be meaningfully
          # exercised in a headless CI environment:
          #   derrick-tui/src/event_loop.rs  — crossterm event loop (real terminal)
          #   derrick-tui/src/tabs.rs        — ratatui render functions (real terminal)
          #   derrick-observe/src/*          — wires a live terminal + substrate
          #   commands/observe.rs            — delegates to the terminal TUI
          #   commands/stack.rs              — shells out to git/gh
          #   commands/uninstall.rs          — user confirmation prompt + FS deletion
          #   commands/init_wizard.rs        — interactive prompts and terminal selection
          #   commands/switch.rs             — execute() reads YAML from disk; print helpers write to terminal
          #   providers/anthropic.rs         — Anthropic Messages API (SSE HTTP, live key)
          #   providers/openai_cli.rs        — codex CLI subprocess or OpenAI API (live key)
          #   providers/opencode.rs          — opencode CLI subprocess (external binary)
          #   providers/subprocess.rs        — shared async subprocess streaming helper
          EXCLUDE='event_loop\.rs|derrick-tui/src/tabs\.rs|derrick-observe/src|commands/(observe|stack|uninstall|init_wizard|switch|ticket|gain|doctor|foreman|add|caveman|scrub)\.rs|derrick-assay/src|derrick-memory/src|derrick-scrub/src|derrick-stack/src|derrick-substrate-native/src/foreman\.rs|derrick-tools/src/hosts|derrick-tools/src/process\.rs|derrick-models/src/providers/(anthropic|openai_cli|opencode|subprocess)\.rs|derrick-substrate/src/types\.rs|derrick-caveman/src|derrick-adopt/src|derrick-claude/src|derrick-copilot/src|derrick-flow/src/code_review\.rs|derrick-flow/src/template\.rs'
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info \
            --ignore-filename-regex "$EXCLUDE" \
            --fail-under-lines 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
