[workspace]
resolver = "2"
members = [
    "crates/derrick-cli",
    "crates/derrick-flow",
    "crates/derrick-tools",
    "crates/derrick-assay",
    "crates/derrick-memory",
    "crates/derrick-scrub",
    "crates/derrick-caveman",
    "crates/derrick-copilot",
    "crates/derrick-claude",
    "crates/derrick-models",
    "crates/derrick-adopt",
    "crates/derrick-substrate",
    "crates/derrick-substrate-native",
    "crates/derrick-stack",
    "crates/derrick-tui",
    "crates/derrick-observe",
    "crates/derrick-config",
    "crates/derrick-roughneck",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/lgulliver/derrick"
authors = ["Liam Gulliver and derrick contributors"]

[workspace.dependencies]
# Async runtime
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
# Config / serialisation
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
# Storage
rusqlite = { version = "0.39", features = ["bundled"] }
# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# Errors and logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Misc
futures = "0.3"
regex = "1"
shell-words = "1"
which = "8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
notify = "8"
owo-colors = "4"
tempfile = "3"
assert_cmd = "2"
ratatui = "0.30"
crossterm = "0.29"

# Workspace-wide lint policy. CI fails on any warning.
# Specialists may relax a lint inside their crate with #![allow(...)] and a
# justifying comment, but defaults are deliberately strict.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Reasonable relaxations (still want the warning surfaced, not denied)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Stay strict on the dangerous ones
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# Faster test compiles
[profile.test]
opt-level = 0
debug = true
